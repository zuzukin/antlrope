[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
  # Build-time README rewriting (relative URLs -> absolute for PyPI); see
  # [tool.hatch.metadata.hooks.fancy-pypi-readme] below.
  "hatch-fancy-pypi-readme",
]
build-backend = "scikit_build_core.build"

[project]
name = "antlrope"
# version: single source of truth is src/antlrope/VERSION (read at build time
# below). readme: assembled from README.md at build time with relative URLs
# rewritten to absolute so images/links render on PyPI (the repo file keeps
# relative paths for GitHub).
dynamic = ["version", "readme"]
description = "Fast, C++-accelerated ANTLR Python runtime for target-agnostic grammars"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Christopher Barber", email = "analog.cbarber@gmail.com" },
]
keywords = ["antlr", "antlr4", "parser", "parsing", "grammar", "python"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: General",
]

# Generated lexer/parser modules subclass the official pure-Python runtime and do
# `from antlr4 import *`, so it must be importable for the documented facade
# workflow (load_specs / walk). The C++ engine itself never imports it, but the
# advertised API requires it, so it is a hard runtime dependency.
dependencies = ["antlr4-python3-runtime>=4.13"]

[project.urls]
Homepage = "https://github.com/zuzukin/antlrope"
Source = "https://github.com/zuzukin/antlrope"
Documentation = "https://zuzukin.github.io/antlrope/"
Changelog = "https://zuzukin.github.io/antlrope/about/changelog/"
Issues = "https://github.com/zuzukin/antlrope/issues"

[project.scripts]
antlrope = "antlrope.cli.main:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# Rebuild explicitly with `pixi run build`, not on every import. The C++ rarely
# changes, and rebuild-on-import made `import antlrope` shell out to cmake,
# which fails wherever the env is not activated (e.g. PyCharm using the prefix as
# a plain interpreter). With this off, imports never touch the build toolchain.
editable.rebuild = false
editable.verbose = false
# Python package lives under src/; the C++ extension sources are in cpp/.
wheel.packages = ["src/antlrope"]
# Build a single CPython Stable ABI (abi3) wheel per platform. The extension is
# compiled with nanobind's STABLE_ABI (see CMakeLists.txt), which targets the
# limited API from CPython 3.12 on, so one `cp312-abi3` wheel runs on 3.12, 3.13,
# 3.14, and future CPythons without a rebuild. Requires `requires-python >= 3.12`.
wheel.py-api = "cp312"

# Project version is read from the VERSION file in the package (the single source
# of truth). `dynamic = ["version"]` above defers to this provider.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/antlrope/VERSION"
regex = '(?P<value>.+)'

# The package README is README.md with its repo-relative URLs rewritten to
# absolute at build time (hatch-fancy-pypi-readme via scikit-build-core's
# bridge), so images and links render on the PyPI project page while the repo
# file keeps the relative paths GitHub renders natively.
[tool.scikit-build.metadata.readme]
provider = "scikit_build_core.metadata.fancy_pypi_readme"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# HTML img/source attributes (the logo <picture> block) -> raw file URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="docs/'
replacement = '\1="https://raw.githubusercontent.com/zuzukin/antlrope/main/docs/'

# Markdown images with relative paths -> raw file URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/zuzukin/antlrope/main/\2)'

# A markdown link WRAPPING an image ([![alt](img)](target)): the generic rule
# below cannot match it (the link text contains the image's own brackets).
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\[!\[[^\]]*\]\([^)]+\)\])\((?!https?://)([^)]+)\)'
replacement = '\1(https://github.com/zuzukin/antlrope/blob/main/\2)'

# Remaining markdown links with relative paths -> GitHub blob URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!\!)\[([^\]]+)\]\((?!https?://)([^)#][^)]*)\)'
replacement = '[\1](https://github.com/zuzukin/antlrope/blob/main/\2)'

[tool.cibuildwheel]
# One CPython Stable ABI (abi3) build per platform: `wheel.py-api = "cp312"` above
# makes scikit-build-core emit a `cp312-abi3` wheel that works on 3.12+, so we
# only need to build under cp312 (not once per CPython). Skip PyPy and the
# 32-bit / musllinux targets to keep the C++ build matrix sane; the vendored
# runtime needs a C++17 compiler (present on all default cibuildwheel images).
build = "cp312-*"
skip = "*-musllinux* *_i686 *-win32"
build-frontend = "build"
# Smoke-test each built wheel: import the extension and print its version. No
# extra test deps are needed — the wheel pulls antlr4-python3-runtime itself.
test-command = "python -c \"import antlrope as a; print(a.__version__)\""

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.ruff]
# Lint/format the hand-written sources, tests, helper scripts, and examples. The
# stock ANTLR-generated lexer/parser modules are excluded: they are tool output,
# not our code, and follow ANTLR's own (non-PEP8) style.
target-version = "py312"
# Excluded: stock ANTLR-generated parsers, the vendored C++ runtime, build/site
# output, and `*.pyi` (the _native stub is produced by `pixi run stubgen` and
# hand-tweaked — formatting it here would just churn against stubgen output).
extend-exclude = ["examples/*/generated", "vendor", "build", "build-asan", "site", "*.pyi"]

[tool.ruff.format]
# Ruff 0.16 also formats Python code blocks in Markdown. The doc examples are
# deliberately compact and hand-aligned, so leave them alone.
exclude = ["*.md"]

[tool.ruff.lint]
# A pragmatic core: pyflakes/pycodestyle (E, F, W), import sorting (I), pyupgrade
# (UP), bugbear (B), comprehensions (C4), simplify (SIM), and Ruff's own lints
# (RUF). pep8-naming (N) is intentionally omitted — the facade mirrors ANTLR's
# camelCase callback names (enterRule, visitTerminal, ...). Line length is left
# to the formatter (E501 off), so prose comments and literals don't nag.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package surfaces its public API by re-export from __init__ (no __all__).
"src/antlrope/__init__.py" = ["F401"]

[tool.pyright]
# Type-check the shipped library and the helper scripts. Tests and examples pull
# in the ANTLR-generated modules via runtime sys.path manipulation, which a
# static checker can't resolve, so they're out of scope here.
include = ["src", "scripts"]
exclude = ["**/__pycache__", "examples/*/generated", "vendor", "build", "build-asan", "site"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# _native is a compiled nanobind extension: pyright resolves its hand-maintained
# `_native.pyi` stub but (correctly) notes there's no Python source behind it.
# That's expected for a C++ extension, so silence the per-import warning.
reportMissingModuleSource = "none"

# Coverage (pytest-cov / coverage.py), driven by the `coverage` pixi task. Measure
# only the shipped package under src/ (the editable install imports it from there),
# and keep every artifact in the git-ignored .coverage/ directory: the data file,
# the HTML site, and the JSON report. The task also prints a summary to stdout.
[tool.coverage.run]
source = ["src/antlrope"]
branch = true
data_file = ".coverage/.coverage"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Native build toolchain + the extension's build backend, from conda-forge. The
# explicit `pixi run build` recompiles via cmake directly (see
# scripts/build_native.py), so the whole rebuild path is reproducible here.
[tool.pixi.dependencies]
python = ">=3.12"
antlr4-python3-runtime = ">=4.13"

[tool.pixi.pypi-dependencies]
# Installs the package from source tree
antlrope = { path = ".", editable = true }

# Build the editable package against the env's own toolchain (not an isolated,
# throwaway one), so the rebuild-on-import hook resolves cmake/ninja correctly.
[tool.pixi.pypi-options]
no-build-isolation = ["antlrope"]

[tool.pixi.activation.env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pixi.feature.dev.dependencies]
cxx-compiler = "*"
cmake = ">=3.21"
ninja = "*"
nanobind = ">=2.0"
scikit-build-core = ">=0.10"
# The editable install builds without isolation, so the env must provide the
# build-time README rewriter too (see [build-system] requires).
hatch-fancy-pypi-readme = "*"
# pypa `build` frontend (conda-forge name `python-build`), so `pixi run build-wheel`
# is a plain `python -m build` invocation.
python-build = "*"
# pytest drives the correctness suite. It is a dev tool only — no end user or
# downstream consumer needs an `antlrope[test]` extra (the suite isn't
# shipped in the wheel), so it lives in the dev environment, not as a published
# optional dependency.
pyright = ">=1.1.414"
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.16.9"
# Formats cpp/ (the `format-cpp` task; config in .clang-format). Pinned to a
# major version: output differs across majors, so an open range would let two
# environments format the same code differently.
clang-format = "22.*"

# Java + the ANTLR tool, isolated in a dedicated feature so the Python build/test
# environments never pull in a JDK.
[tool.pixi.feature.gen.dependencies]
openjdk = ">=11"
antlr4-tools = "*"

# Documentation toolchain, all from conda-forge (except mike, below). Isolated and
# default-feature-free so it pulls neither the JDK nor the C++ build toolchain —
# building the docs never compiles the extension.
[tool.pixi.feature.docs.dependencies]
python = ">=3.12"
# Zensical (Material-for-MkDocs-team static site generator) + the mkdocstrings/griffe
# API-reference handler. Ruff formats the rendered signatures (separate_signature +
# line_length in zensical.toml); mkdocstrings imports `ruff.__main__.find_ruff_bin`,
# which the conda-forge ruff package provides.
zensical = ">=0.0.65,<0.2.0"
mkdocstrings-python = ">=2.0"
mkdocstrings-python-xref = ">=2.1.1"
ruff = ">=0.16.9"

[tool.pixi.feature.docs.pypi-dependencies]
# Versioned-docs deploys to gh-pages (the docs-deploy / docs-set-default tasks).
# Must be the zensical-compatible fork (it builds via zensical, not mkdocs); it is
# not on PyPI.
mike = { git = "https://github.com/squidfunk/mike.git" }

# conda-forge recipe builder (rattler-build). Isolated with no default feature:
# rattler-build creates its own sandboxed build/host environment from the recipe,
# so the package's own C++ toolchain feature is not needed here.
[tool.pixi.feature.recipe.dependencies]
rattler-build = "*"

# Local conda packaging via whl2conda (convert a built wheel to a .conda). Layered
# on top of `dev` (the `pack` env below = dev + this) so `build_conda.py` can both
# build the wheel and convert it in one environment.
[tool.pixi.feature.pack.dependencies]
whl2conda = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
gen = { features = ["gen"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }
recipe = { features = ["recipe"], no-default-feature = true }
pack = { features = ["dev", "pack"], solve-group = "default" }

[tool.pixi.tasks]
doc-build = [{ task = "docs-build" }]
doc-serve = [{ task = "docs-serve" }]
doc-show = [{ task = "docs-serve" }]

[tool.pixi.tasks.example]
description = "Run the JSON reconstruction example end to end."
cmd = "python to_python.py"
cwd = "examples/json"

[tool.pixi.tasks.example-schema]
description = "Run the schema indexing / parallel-chunking example end to end."
cmd = "python index.py"
cwd = "examples/schema"

[tool.pixi.tasks.lint]
description = "Lint with ruff (report only; run `format` to apply style fixes)."
cmd = "ruff check ."

[tool.pixi.tasks.format]
description = "Format the code with ruff (also sorts imports via `lint --fix`)."
cmd = "ruff format ."

[tool.pixi.tasks.format-cpp]
description = "Format the C++ sources with clang-format (config in .clang-format)."
cmd = "clang-format -i cpp/*.cpp cpp/*.h"

[tool.pixi.tasks.typecheck]
description = "Static type-check the package and scripts with pyright."
cmd = "pyright"

[tool.pixi.tasks.check]
description = "Full local gate: lint, type-check, and run the test suite."
depends-on = ["lint", "typecheck", "test"]

[tool.pixi.tasks.test]
description = "Run the pytest correctness suite."
cmd = "pytest"

[tool.pixi.tasks.coverage]
description = "Run the test suite under coverage; write an HTML site + JSON/XML reports into .coverage/ and print a summary to stdout."
cmd = "mkdir -p .coverage && pytest --cov --cov-report=term-missing --cov-report=html:.coverage/html --cov-report=json:.coverage/coverage.json --cov-report=xml:.coverage/coverage.xml"

[tool.pixi.tasks.build]
description = "Rebuild the _native C++ extension (run after editing cpp/ or the vendored runtime)."
cmd = "python scripts/build_native.py"
inputs = ["cpp/**/*", "vendor/antlr4-cpp/src/**/*", "CMakeLists.txt", "scripts/build_native.py"]
# Track the abi3 editable artifact (`_native.abi3.so`) — not a version-tagged
# `_native.cpython-*.so`, which the default env never loads, so caching on it let
# stale builds slip through.
outputs = ["build/*/_native*.so"]

[tool.pixi.tasks.build-wheel]
description = "Build a distributable abi3 wheel into dist/ (pypa build + scikit-build-core, no isolation)."
cmd = "python -m build --wheel --no-isolation --outdir dist"
inputs = ["src/antlrope/**/*", "cpp/**/*", "vendor/antlr4-cpp/src/**/*", "CMakeLists.txt", "pyproject.toml"]
outputs = ["dist/*.whl"]

[tool.pixi.tasks.clean]
description = "Remove all generated artifacts"
depends-on = ["clean-build", "clean-doc", "clean-coverage", "clean-dist"]

[tool.pixi.tasks.clean-asan]
description = "Remove ASan-instrumented extension build"
cmd = "rm -rf build-asan"

[tool.pixi.tasks.clean-build]
description = "Remove generated C++ extension"
cmd = "rm -rf build/cp*-*"

[tool.pixi.tasks.clean-doc]
description = "Remove generated documentation artifacts"
cmd = "rm -rf site .zensical"

[tool.pixi.tasks.clean-coverage]
description = "Remove generated coverage reports"
cmd = "rm -rf .coverage"

[tool.pixi.tasks.clean-dist]
description = "Remove built wheel and conda distributions"
cmd = "rm -rf dist wheelhouse output"

[tool.pixi.tasks.stubgen]
description = "Regenerate src/antlrope/_native.pyi from the built extension (runs nanobind stubgen + re-applies the hand edits)."
cmd = "python scripts/stubgen.py"
inputs = ["build/*/_native*.so", "scripts/stubgen.py"]
outputs = ["src/antlrope/_native.pyi"]

[tool.pixi.tasks.gen-cli-docs]
description = "Regenerate the CLI reference in docs/reference/cli.md from the live `--help` output."
cmd = "python scripts/gen_cli_docs.py"

[tool.pixi.tasks.asan-test]
description = "Build and run the AddressSanitizer C++ harness over the example grammars (macOS + Linux)."
cmd = "python scripts/asan_harness.py"

[tool.pixi.tasks.asan-pytest]
description = "Run the pytest suite under AddressSanitizer (Linux; skipped on macOS). Covers the binding too."
cmd = "python scripts/asan_pytest.py"

[tool.pixi.feature.gen.tasks.gen-json]
description = "Regenerate the example's Python parser/lexer from the grammar (ANTLR tool)."
cmd = "antlr4 -Dlanguage=Python3 -no-listener JSON.g4 -o generated"
cwd = "examples/json"
env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" }
inputs = ["examples/json/JSON.g4"]
outputs = ["examples/json/generated/*.py"]

[tool.pixi.feature.gen.tasks.gen-facade]
description = "Regenerate the event-listener facade from the generated parser module."
cmd = "antlrope gen generated.JSONParser JSON -o json_listener.py"
cwd = "examples/json"
env = { PYTHONPATH = "." }
inputs = ["examples/json/generated/*.py"]
outputs = ["examples/json/json_listener.py"]

[tool.pixi.feature.gen.tasks.gen-pred]
description = "Regenerate the predicate-limitation fixture's parser/lexer (tests/test_predicate_limitation.py)."
cmd = "antlr4 -Dlanguage=Python3 -no-listener Pred.g4 -o generated"
cwd = "examples/predicate"
env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" }
inputs = ["examples/predicate/Pred.g4"]
outputs = ["examples/predicate/generated/*.py"]

[tool.pixi.feature.gen.tasks.gen-schema]
description = "Regenerate the schema example's Python parser/lexer from the grammar (ANTLR tool)."
cmd = "antlr4 -Dlanguage=Python3 -no-listener Schema.g4 -o generated"
cwd = "examples/schema"
env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" }
inputs = ["examples/schema/Schema.g4"]
outputs = ["examples/schema/generated/*.py"]

[tool.pixi.feature.gen.tasks.gen-schema-facade]
description = "Regenerate the schema example's event-listener facade."
cmd = "antlrope gen generated.SchemaParser Schema -o schema_listener.py"
cwd = "examples/schema"
env = { PYTHONPATH = "." }
inputs = ["examples/schema/generated/*.py"]
outputs = ["examples/schema/schema_listener.py"]

[tool.pixi.feature.docs.tasks.docs-build]
description = "Build the static documentation site into site/ (configured in zensical.toml)."
cmd = "zensical build"
inputs = ["docs/**/*", "zensical.toml", "src/antlrope/**/*.py", "README.md", "CHANGELOG.md", "LICENSE"]
outputs = ["site/**/*"]

[tool.pixi.feature.docs.tasks.docs-serve]
description = "Serve the docs locally with live reload at http://localhost:8000."
cmd = "zensical serve"

[tool.pixi.feature.docs.tasks.doc-clean]
description = "Remove generated doc files"
cmd = "rm -rf site"

# Versioned-docs publishing to the gh-pages branch via mike (the fork in this env
# builds with zensical). Versions are keyed by major.minor, so re-deploying a patch
# overwrites its x.y in place — minor doc edits don't pile up versions. A later
# CI/release-driven flow can call the same `mike deploy` instead.
[tool.pixi.feature.docs.tasks.docs-deploy]
description = "Build + deploy the current docs to gh-pages under their major.minor (aliased `latest`) and push."
cmd = "mike deploy --push --update-aliases $(python -c \"print('.'.join(open('src/antlrope/VERSION').read().split('.')[:2]))\") latest"

[tool.pixi.feature.docs.tasks.docs-set-default]
description = "Point the gh-pages site root at the `latest` alias and push (run once, after the first deploy)."
cmd = "mike set-default --push latest"

[tool.pixi.feature.docs.tasks.docs-versions]
description = "List the doc versions currently deployed on gh-pages (mike list)."
cmd = "mike list"

# Two local conda-build paths (each in its own environment):
#   pixi run -e pack conda-whl2conda  — fast: build the abi3 wheel, convert it
#       directly to a .conda with whl2conda (no isolated build env). Good for a
#       private channel / direct hand-off. See zuzukin/whl2conda#183 re: abi3 pins.
#   pixi run -e recipe recipe-build   — full rattler-build from conda-recipe/, the
#       path that mirrors conda-forge (builds in a sandboxed host env).
[tool.pixi.feature.pack.tasks.conda-whl2conda]
description = "Convert the built abi3 wheel in dist/ to a .conda with whl2conda (--allow-impure). See zuzukin/whl2conda#183 re: abi3 pins."
depends-on = ["build-wheel"]
cmd = "whl2conda convert dist/*.whl --allow-impure --out-dir dist --overwrite"
inputs = ["dist/*.whl"]
outputs = ["dist/*.conda"]

# TODO - maybe rename conda-recipe to conda-forge-recipe?
[tool.pixi.feature.recipe.tasks.recipe-build]
description = "Build the conda package locally from conda-recipe/recipe.yaml (rattler-build)."
cmd = "rattler-build build --recipe conda-recipe/recipe.yaml"
# Builds from the PyPI sdist in the recipe, so the recipe is the only local input.
inputs = ["conda-recipe/recipe.yaml"]
outputs = ["output/**/*.conda"]
