<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="antlrope">
  <title>antlrope</title>
  <desc>A tan antelope head with ridged horns tapering to a point; the ridges read as a stream of ordered events.</desc>
  <defs>
    <linearGradient id="faceT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2a96f"/>
      <stop offset="1" stop-color="#9c6a33"/>
    </linearGradient>
    <clipPath id="hlT"><path d="M125 118 C 112 86, 95 52, 78 18 C 83 50, 97 86, 107 118 Z"/></clipPath>
    <clipPath id="hrT"><path d="M131 118 C 144 86, 161 52, 178 18 C 173 50, 159 86, 149 118 Z"/></clipPath>
  </defs>
  <!-- horns: thick at the base, tapering gradually to a smooth point; ridges = ordered events -->
  <path fill="#6e4420" d="M125 118 C 112 86, 95 52, 78 18 C 83 50, 97 86, 107 118 Z"/>
  <path fill="#6e4420" d="M131 118 C 144 86, 161 52, 178 18 C 173 50, 159 86, 149 118 Z"/>
  <g stroke="#46280f" stroke-width="3" stroke-linecap="round">
    <g clip-path="url(#hlT)">
      <line x1="100.8" y1="103.2" x2="117.6" y2="96.8"/><line x1="92.4" y1="81.2" x2="109.2" y2="74.8"/>
      <line x1="84" y1="59.2" x2="100.8" y2="52.8"/><line x1="76.4" y1="39.2" x2="93.2" y2="32.8"/>
    </g>
    <g clip-path="url(#hrT)">
      <line x1="155.2" y1="103.2" x2="138.4" y2="96.8"/><line x1="163.6" y1="81.2" x2="146.8" y2="74.8"/>
      <line x1="172" y1="59.2" x2="155.2" y2="52.8"/><line x1="179.6" y1="39.2" x2="162.8" y2="32.8"/>
    </g>
  </g>
  <!-- ears -->
  <path fill="#5c3a1c" d="M97 120 C 74 110, 50 105, 40 119 C 53 134, 80 136, 99 127 Z"/>
  <path fill="#5c3a1c" d="M159 120 C 182 110, 206 105, 216 119 C 203 134, 176 136, 157 127 Z"/>
  <!-- face: rounded muzzle, not a sharp point -->
  <path fill="url(#faceT)" d="M95 116 C 89 154, 99 190, 118 214 C 124 221, 132 221, 138 214 C 157 190, 167 154, 161 116 C 154 101, 102 101, 95 116 Z"/>
  <!-- eyes with catchlight -->
  <ellipse cx="113" cy="154" rx="7.5" ry="10" fill="#2a1808"/>
  <ellipse cx="143" cy="154" rx="7.5" ry="10" fill="#2a1808"/>
  <circle cx="115.4" cy="150.5" r="2.2" fill="#fff6e8"/>
  <circle cx="145.4" cy="150.5" r="2.2" fill="#fff6e8"/>
</svg>
