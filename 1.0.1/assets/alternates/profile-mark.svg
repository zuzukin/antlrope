<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="antlrope">
  <title>antlrope</title>
  <desc>A tan antelope head in profile with two ridged horns swept back.</desc>
  <defs>
    <linearGradient id="faceP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a96f"/>
      <stop offset="1" stop-color="#9c6a33"/>
    </linearGradient>
    <clipPath id="hp1"><path d="M124 86 C 150 62, 182 46, 220 32 C 186 54, 152 78, 134 94 Z"/></clipPath>
    <clipPath id="hp2"><path d="M138 94 C 166 76, 198 62, 232 52 C 200 70, 166 88, 148 102 Z"/></clipPath>
  </defs>
  <!-- horns swept back -->
  <path fill="#6e4420" d="M124 86 C 150 62, 182 46, 220 32 C 186 54, 152 78, 134 94 Z"/>
  <path fill="#5c3a1c" d="M138 94 C 166 76, 198 62, 232 52 C 200 70, 166 88, 148 102 Z"/>
  <g stroke="#46280f" stroke-width="2.6" stroke-linecap="round">
    <g clip-path="url(#hp1)">
      <line x1="150" y1="56" x2="158" y2="76"/><line x1="170" y1="46" x2="178" y2="66"/>
      <line x1="190" y1="40" x2="198" y2="60"/>
    </g>
    <g clip-path="url(#hp2)">
      <line x1="166" y1="68" x2="174" y2="88"/><line x1="188" y1="60" x2="196" y2="80"/>
    </g>
  </g>
  <!-- ear -->
  <path fill="#5c3a1c" d="M140 100 C 158 104, 174 112, 182 124 C 168 124, 152 116, 140 108 Z"/>
  <!-- head + neck, facing left -->
  <path fill="url(#faceP)" d="M44 158
    C 60 130, 80 108, 100 94
    C 112 82, 124 80, 134 86
    C 144 92, 150 102, 151 118
    C 153 150, 160 184, 168 214
    C 144 224, 120 224, 104 218
    C 92 202, 82 190, 72 182
    C 62 176, 52 172, 48 169
    C 44 165, 43 161, 44 158 Z"/>
  <!-- eye + nostril -->
  <ellipse cx="92" cy="120" rx="6.5" ry="8.5" fill="#2a1808"/>
  <circle cx="94.2" cy="116.2" r="2" fill="#fff6e8"/>
  <ellipse cx="56" cy="150" rx="3.5" ry="2.6" fill="#46280f"/>
</svg>
