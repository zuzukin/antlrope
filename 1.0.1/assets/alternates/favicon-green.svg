<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="antlrope">
  <title>antlrope</title>
  <desc>An antelope head with ridged horns rendered as a stream of ordered segments.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- horns: thick dashed strokes = ridged horn that doubles as an ordered event stream -->
  <g fill="none" stroke="#10b981" stroke-width="19" stroke-linecap="round" stroke-dasharray="13 12">
    <path d="M112 112 C 95 78, 74 52, 60 20"/>
    <path d="M144 112 C 161 78, 182 52, 196 20"/>
  </g>
  <!-- ears -->
  <path fill="#047857" d="M97 120 C 74 110, 50 105, 40 119 C 53 134, 80 136, 99 127 Z"/>
  <path fill="#047857" d="M159 120 C 182 110, 206 105, 216 119 C 203 134, 176 136, 157 127 Z"/>
  <!-- face -->
  <path fill="url(#face)" d="M95 116 C 88 156, 100 196, 128 222 C 156 196, 168 156, 161 116 C 154 101, 102 101, 95 116 Z"/>
  <!-- eyes -->
  <ellipse cx="113" cy="154" rx="7.5" ry="10" fill="#ecfdf5"/>
  <ellipse cx="143" cy="154" rx="7.5" ry="10" fill="#ecfdf5"/>
</svg>
