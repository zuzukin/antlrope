<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="antlrope logo">
  <title>antlrope</title>
  <desc>The antlrope antelope mark beside the antlrope wordmark, with "ope" — Ordered Parse Events — accented.</desc>
  <defs>
    <linearGradient id="face2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(8,18) scale(0.80)">
    <g fill="none" stroke="#10b981" stroke-width="19" stroke-linecap="round" stroke-dasharray="13 12">
      <path d="M112 112 C 95 78, 74 52, 60 20"/>
      <path d="M144 112 C 161 78, 182 52, 196 20"/>
    </g>
    <path fill="#047857" d="M97 120 C 74 110, 50 105, 40 119 C 53 134, 80 136, 99 127 Z"/>
    <path fill="#047857" d="M159 120 C 182 110, 206 105, 216 119 C 203 134, 176 136, 157 127 Z"/>
    <path fill="url(#face2)" d="M95 116 C 88 156, 100 196, 128 222 C 156 196, 168 156, 161 116 C 154 101, 102 101, 95 116 Z"/>
    <ellipse cx="113" cy="154" rx="7.5" ry="10" fill="#ecfdf5"/>
    <ellipse cx="143" cy="154" rx="7.5" ry="10" fill="#ecfdf5"/>
  </g>
  <!-- wordmark: antlr + ope (Ordered Parse Events) accented -->
  <text x="244" y="158" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="-3">
    <tspan fill="#059669">antlr</tspan><tspan fill="#34d399">ope</tspan>
  </text>
</svg>
