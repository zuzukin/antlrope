<svg viewBox="0 0 820 412" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#34d399" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="820" height="412" rx="18" fill="#0b1220"/>
  <rect x="1" y="1" width="818" height="410" rx="17" fill="none" stroke="#1e293b"/>
  <text x="40" y="48" fill="#f1f5f9" font-size="23" font-weight="800">antlrope vs. the alternatives</text>
  <text x="40" y="74" fill="#94a3b8" font-size="13.5">Parse + read a 2.6&#8202;MB SystemRDL file &#183; lower is better &#183; ~21&#215; faster than pure-Python, ~8&#215; faster than speedy-antlr</text>
<text x="60" y="98" fill="#cbd5e1" font-size="14" font-weight="600">Time (ms)</text>
<line x1="60" y1="318" x2="390" y2="318" stroke="#1e293b" stroke-width="1"/>
<rect x="80" y="130" width="64" height="188" rx="5" fill="#64748b"/>
<text x="112" y="121" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">3,963 ms</text>
<rect x="180" y="241" width="64" height="77" rx="5" fill="#fbbf24"/>
<text x="212" y="232" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">1,618 ms</text>
<rect x="280" y="310" width="64" height="8" rx="5" fill="#34d399" filter="url(#glow)"/>
<text x="312" y="301" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">174 ms</text>
<text x="312" y="283" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">22.8&#215; faster</text>
<text x="430" y="98" fill="#cbd5e1" font-size="14" font-weight="600">Peak memory (MB)</text>
<line x1="430" y1="318" x2="760" y2="318" stroke="#1e293b" stroke-width="1"/>
<rect x="450" y="262" width="64" height="56" rx="5" fill="#64748b"/>
<text x="482" y="253" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">418 MB</text>
<rect x="550" y="130" width="64" height="188" rx="5" fill="#fbbf24"/>
<text x="582" y="121" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">1,398 MB</text>
<rect x="650" y="289" width="64" height="29" rx="5" fill="#34d399" filter="url(#glow)"/>
<text x="682" y="280" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="700">218 MB</text>
<text x="682" y="262" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">6.4&#215; less</text>
<rect x="168" y="372" width="13" height="13" rx="3" fill="#64748b"/>
<text x="187" y="383" fill="#cbd5e1" font-size="12.5">pure-Python</text>
<rect x="307.6" y="372" width="13" height="13" rx="3" fill="#fbbf24"/>
<text x="326.6" y="383" fill="#cbd5e1" font-size="12.5">speedy-antlr</text>
<rect x="454.8" y="372" width="13" height="13" rx="3" fill="#34d399"/>
<text x="473.8" y="383" fill="#cbd5e1" font-size="12.5">antlrope</text>
</svg>
